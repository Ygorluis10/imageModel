<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goku Black — AI Vision</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Rajdhani:wght@300;400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #f0d080;
    --gold-dim: #7a5e20;
    --black: #050507;
    --deep: #0a0a10;
    --surface: #111118;
    --surface2: #18181f;
    --purple: #6b21a8;
    --purple-glow: #a855f7;
    --text: #e8e0f0;
    --muted: #7a7090;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--black);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .bg-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .bg-grid {
    background-image:
      linear-gradient(rgba(107,33,168,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(107,33,168,0.07) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .bg-radial {
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(107,33,168,0.18) 0%, transparent 70%),
                radial-gradient(ellipse 40% 40% at 20% 80%, rgba(201,168,76,0.08) 0%, transparent 60%);
  }
  .scanlines {
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px);
    opacity: 0.4;
  }
  .particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .particle {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: var(--gold); animation: float-up linear infinite; opacity: 0;
  }
  @keyframes float-up {
    0%   { transform: translateY(100vh) translateX(0); opacity: 0; }
    10%  { opacity: 0.8; }
    90%  { opacity: 0.4; }
    100% { transform: translateY(-20px) translateX(30px); opacity: 0; }
  }
  .wrapper { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 2.5rem 1.5rem 1rem; text-align: center; }
  .eyebrow {
    font-family: 'Orbitron', monospace; font-size: 0.65rem;
    letter-spacing: 0.35em; color: var(--gold); text-transform: uppercase;
    margin-bottom: 0.6rem; opacity: 0.85;
  }
  .site-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(2.2rem, 7vw, 4.5rem); font-weight: 900; line-height: 1; letter-spacing: 0.04em;
    background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 40%, var(--gold-dim) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    filter: drop-shadow(0 0 32px rgba(201,168,76,0.35));
    animation: title-pulse 4s ease-in-out infinite;
  }
  @keyframes title-pulse {
    0%,100% { filter: drop-shadow(0 0 24px rgba(201,168,76,0.3)); }
    50%      { filter: drop-shadow(0 0 48px rgba(201,168,76,0.6)); }
  }
  .site-sub {
    font-family: 'Orbitron', monospace; font-size: clamp(0.6rem, 2vw, 0.8rem);
    letter-spacing: 0.5em; color: var(--purple-glow); margin-top: 0.5rem; opacity: 0.7; text-transform: uppercase;
  }
  .header-line {
    width: 200px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 1.2rem auto 0; animation: line-glow 3s ease-in-out infinite;
  }
  @keyframes line-glow {
    0%,100% { opacity: 0.4; width: 200px; }
    50%      { opacity: 1; width: 320px; }
  }
  .main-card {
    background: var(--surface); border: 1px solid rgba(201,168,76,0.15);
    border-radius: 16px; padding: 2rem; position: relative; overflow: hidden;
  }
  .main-card::before {
    content: ''; position: absolute; inset: 0; border-radius: 16px;
    background: linear-gradient(135deg, rgba(201,168,76,0.06) 0%, transparent 50%, rgba(107,33,168,0.06) 100%);
    pointer-events: none;
  }
  .corner-accent { position: absolute; width: 24px; height: 24px; border-color: var(--gold); border-style: solid; opacity: 0.5; }
  .corner-accent.tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
  .corner-accent.tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; }
  .corner-accent.bl { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; }
  .corner-accent.br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }
  .cam-wrapper { position: relative; width: 100%; max-width: 300px; margin: 0 auto; }
  .cam-frame {
    position: relative; border-radius: 12px; overflow: hidden;
    border: 1px solid rgba(201,168,76,0.25); background: var(--deep);
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  }
  .cam-frame::after {
    content: ''; position: absolute; inset: 0; border-radius: 12px;
    box-shadow: inset 0 0 40px rgba(107,33,168,0.3), 0 0 40px rgba(201,168,76,0.12);
    pointer-events: none;
  }
  #webcam-container { width: 100%; height: 100%; }
  #webcam-container canvas { width: 100% !important; height: 100% !important; object-fit: cover; border-radius: 11px; display: block; }
  .cam-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 2rem; text-align: center; }
  .cam-icon {
    width: 60px; height: 60px; border-radius: 50%;
    background: rgba(107,33,168,0.2); border: 1px solid rgba(107,33,168,0.4);
    display: flex; align-items: center; justify-content: center;
  }
  .cam-icon svg { width: 28px; height: 28px; stroke: var(--purple-glow); fill: none; stroke-width: 1.5; }
  .cam-placeholder p { font-size: 0.8rem; color: var(--muted); letter-spacing: 0.05em; }
  .scan-line {
    position: absolute; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--purple-glow), transparent);
    opacity: 0; animation: scan 3s linear infinite; pointer-events: none; z-index: 2;
  }
  @keyframes scan { 0% { top: 0%; opacity: 0; } 5% { opacity: 0.7; } 95% { opacity: 0.7; } 100% { top: 100%; opacity: 0; } }
  .cam-status {
    position: absolute; bottom: 10px; right: 10px;
    display: flex; align-items: center; gap: 6px;
    background: rgba(5,5,7,0.8); border: 1px solid rgba(201,168,76,0.2);
    border-radius: 20px; padding: 4px 10px;
    font-family: 'Orbitron', monospace; font-size: 0.55rem; letter-spacing: 0.1em;
    color: var(--muted); z-index: 3; transition: all 0.3s;
  }
  .cam-status.live { color: #4ade80; border-color: rgba(74,222,128,0.4); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
  .cam-status.live .status-dot { background: #4ade80; box-shadow: 0 0 6px #4ade80; animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .btn-activate {
    position: relative; background: transparent; border: none; padding: 0;
    cursor: pointer; width: 100%; max-width: 280px; display: block; margin: 1.5rem auto 0; outline: none;
  }
  .btn-activate:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-inner {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: linear-gradient(135deg, rgba(201,168,76,0.12), rgba(107,33,168,0.12));
    border: 1px solid var(--gold-dim); border-radius: 8px; padding: 0.85rem 2rem;
    font-family: 'Orbitron', monospace; font-size: 0.75rem; font-weight: 700;
    letter-spacing: 0.25em; color: var(--gold); text-transform: uppercase;
    transition: all 0.3s ease; position: relative; overflow: hidden;
  }
  .btn-inner::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(201,168,76,0.18), rgba(107,33,168,0.18));
    opacity: 0; transition: opacity 0.3s;
  }
  .btn-activate:not(:disabled):hover .btn-inner::before { opacity: 1; }
  .btn-activate:not(:disabled):hover .btn-inner {
    border-color: var(--gold); box-shadow: 0 0 24px rgba(201,168,76,0.25), inset 0 0 20px rgba(201,168,76,0.05);
    transform: translateY(-1px);
  }
  .btn-activate:not(:disabled):active .btn-inner { transform: translateY(0); }
  .btn-icon {
    width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--gold);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative; z-index: 1;
  }
  .btn-icon::after { content: ''; width: 0; height: 0; border-left: 6px solid var(--gold); border-top: 4px solid transparent; border-bottom: 4px solid transparent; margin-left: 2px; }
  .btn-text { position: relative; z-index: 1; }
  .predictions-header { display: flex; align-items: center; gap: 10px; margin-bottom: 1.2rem; }
  .predictions-header h2 { font-family: 'Orbitron', monospace; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.3em; color: var(--gold); text-transform: uppercase; }
  .predictions-header .h-line { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(201,168,76,0.4), transparent); }
  .prediction-item { margin-bottom: 1rem; position: relative; }
  .pred-label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .pred-name { font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.08em; color: var(--text); text-transform: uppercase; }
  .pred-pct { font-family: 'Orbitron', monospace; font-size: 0.75rem; font-weight: 700; color: var(--gold); min-width: 48px; text-align: right; transition: color 0.3s; }
  .pred-pct.high { color: #a855f7; text-shadow: 0 0 10px rgba(168,85,247,0.5); }
  .prog-track { height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; position: relative; }
  .prog-fill {
    height: 100%; border-radius: 3px; width: 0%;
    transition: width 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    position: relative; background: linear-gradient(90deg, var(--gold-dim), var(--gold));
  }
  .prog-fill.dominant { background: linear-gradient(90deg, #6b21a8, #a855f7); box-shadow: 0 0 12px rgba(168,85,247,0.5); }
  .prog-fill::after { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 20px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3)); animation: shimmer 1.5s ease-in-out infinite; }
  @keyframes shimmer { 0%,100% { opacity: 0; } 50% { opacity: 1; } }
  #label-container { display: none; }
  .section-label {
    font-family: 'Orbitron', monospace; font-size: 0.6rem; letter-spacing: 0.35em;
    color: var(--muted); text-transform: uppercase; margin-bottom: 0.75rem;
    display: flex; align-items: center; gap: 8px;
  }
  .section-label::before { content: ''; display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 6px var(--gold); }
  .divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(201,168,76,0.2), transparent); margin: 1.5rem 0; }
  footer { text-align: center; padding: 1.5rem; font-family: 'Orbitron', monospace; font-size: 0.5rem; letter-spacing: 0.2em; color: var(--muted); opacity: 0.5; }
  @media (max-width: 576px) {
    .main-card { padding: 1.25rem; }
    .site-title { font-size: clamp(1.6rem, 10vw, 2.5rem); }
  }
</style>
</head>
<body>
<div class="bg-layer bg-grid"></div>
<div class="bg-layer bg-radial"></div>
<div class="bg-layer scanlines"></div>
<div class="particles" id="particles"></div>

<div class="wrapper">
  <header>
    <p class="eyebrow">Teachable Machine // AI Vision</p>
    <h1 class="site-title">GOKU BLACK</h1>
    <p class="site-sub">Zero Mortal Plan — Neural Interface</p>
    <div class="header-line"></div>
  </header>

  <main class="container" style="max-width:800px; padding-bottom:3rem;">
    <div class="row g-3">
      <div class="col-12 col-md-5">
        <div class="main-card h-100">
          <div class="corner-accent tl"></div><div class="corner-accent tr"></div>
          <div class="corner-accent bl"></div><div class="corner-accent br"></div>
          <p class="section-label">Câmera Neural</p>
          <div class="cam-wrapper">
            <div class="cam-frame" id="cam-frame">
              <div class="scan-line" id="scan-line" style="display:none;"></div>
              <div class="cam-placeholder" id="cam-placeholder">
                <div class="cam-icon">
                  <svg viewBox="0 0 24 24"><path d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.36a1 1 0 01-1.447.89L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/></svg>
                </div>
                <p>Câmera desativada<br>Clique em ativar</p>
              </div>
              <div id="webcam-container" style="position:absolute;inset:0;display:none;"></div>
              <div class="cam-status" id="cam-status">
                <span class="status-dot"></span>
                <span id="status-text">OFFLINE</span>
              </div>
            </div>
          </div>
          <button class="btn-activate" id="start-btn" onclick="init()">
            <div class="btn-inner">
              <span class="btn-icon"></span>
              <span class="btn-text">Ativar Câmera</span>
            </div>
          </button>
        </div>
      </div>

      <div class="col-12 col-md-7">
        <div class="main-card h-100">
          <div class="corner-accent tl"></div><div class="corner-accent tr"></div>
          <div class="corner-accent bl"></div><div class="corner-accent br"></div>
          <div class="predictions-header">
            <h2>Análise de Classe</h2>
            <div class="h-line"></div>
          </div>
          <div id="pred-container">
            <div class="prediction-item">
              <div class="pred-label-row">
                <span class="pred-name" style="color:var(--muted);">Aguardando inicialização</span>
                <span class="pred-pct" style="color:var(--muted);">—</span>
              </div>
              <div class="prog-track"><div class="prog-fill" style="width:0%"></div></div>
            </div>
            <div class="prediction-item" style="opacity:0.4;">
              <div class="pred-label-row">
                <span class="pred-name" style="color:var(--muted);">—</span>
                <span class="pred-pct" style="color:var(--muted);">—</span>
              </div>
              <div class="prog-track"><div class="prog-fill" style="width:0%"></div></div>
            </div>
            <div class="prediction-item" style="opacity:0.2;">
              <div class="pred-label-row">
                <span class="pred-name" style="color:var(--muted);">—</span>
                <span class="pred-pct" style="color:var(--muted);">—</span>
              </div>
              <div class="prog-track"><div class="prog-fill" style="width:0%"></div></div>
            </div>
          </div>
          <div class="divider"></div>
          <p class="section-label">Status do Modelo</p>
          <p style="font-family:'Orbitron',monospace;font-size:0.6rem;color:var(--muted);letter-spacing:0.1em;" id="model-status">Aguardando ativação...</p>
        </div>
      </div>
    </div>
  </main>

  <footer>© GOKU BLACK — ZERO MORTAL PLAN // AI VISION SYSTEM</footer>
</div>

<div id="label-container" style="display:none;"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
<script>
(function(){
  const c = document.getElementById('particles');
  for(let i=0;i<30;i++){
    const p=document.createElement('div'); p.className='particle';
    p.style.left=Math.random()*100+'vw';
    p.style.animationDuration=(8+Math.random()*12)+'s';
    p.style.animationDelay=(Math.random()*15)+'s';
    p.style.width=p.style.height=(Math.random()>0.7?3:2)+'px';
    if(Math.random()>0.7) p.style.background='#a855f7';
    c.appendChild(p);
  }
})();

const URL="https://teachablemachine.withgoogle.com/models/5V1kTQCma/";
let model,webcam,labelContainer,maxPredictions,initialized=false;

async function init(){
  if(initialized)return;
  const btn=document.getElementById('start-btn');
  btn.disabled=true;
  btn.querySelector('.btn-text').textContent='Carregando...';
  document.getElementById('model-status').textContent='Carregando modelo de IA...';
  try{
    model=await tmImage.load(URL+"model.json",URL+"metadata.json");
    maxPredictions=model.getTotalClasses();
    document.getElementById('model-status').textContent='Modelo ativo — '+maxPredictions+' classe(s) detectada(s)';
    webcam=new tmImage.Webcam(300,300,true);
    await webcam.setup(); await webcam.play();
    window.requestAnimationFrame(loop);
    document.getElementById('cam-placeholder').style.display='none';
    const wc=document.getElementById('webcam-container');
    wc.style.display='block'; wc.appendChild(webcam.canvas);
    document.getElementById('scan-line').style.display='block';
    const s=document.getElementById('cam-status');
    s.classList.add('live'); document.getElementById('status-text').textContent='LIVE';
    btn.querySelector('.btn-text').textContent='Câmera Ativa';
    labelContainer=document.getElementById('label-container');
    for(let i=0;i<maxPredictions;i++) labelContainer.appendChild(document.createElement('div'));
    buildPredUI(); initialized=true;
  }catch(e){
    btn.disabled=false; btn.querySelector('.btn-text').textContent='Ativar Câmera';
    document.getElementById('model-status').textContent='Erro ao carregar. Tente novamente.';
    console.error(e);
  }
}

function buildPredUI(){
  const c=document.getElementById('pred-container'); c.innerHTML='';
  for(let i=0;i<maxPredictions;i++){
    const d=document.createElement('div'); d.className='prediction-item';
    d.innerHTML=`<div class="pred-label-row"><span class="pred-name" id="pname-${i}">Classe ${i+1}</span><span class="pred-pct" id="ppct-${i}">0%</span></div><div class="prog-track"><div class="prog-fill" id="pbar-${i}"></div></div>`;
    c.appendChild(d);
  }
}

async function loop(){ webcam.update(); await predict(); window.requestAnimationFrame(loop); }

async function predict(){
  const pred=await model.predict(webcam.canvas);
  let mx=0,mi=0;
  for(let i=0;i<maxPredictions;i++) if(pred[i].probability>mx){mx=pred[i].probability;mi=i;}
  for(let i=0;i<maxPredictions;i++){
    const pct=Math.round(pred[i].probability*100);
    const n=document.getElementById('pname-'+i);
    const p=document.getElementById('ppct-'+i);
    const b=document.getElementById('pbar-'+i);
    if(n) n.textContent=pred[i].className;
    if(p){ p.textContent=pct+'%'; p.className='pred-pct'+(i===mi&&pct>50?' high':''); }
    if(b){ b.style.width=pct+'%'; b.className='prog-fill'+(i===mi&&pct>50?' dominant':''); }
    if(labelContainer.childNodes[i]) labelContainer.childNodes[i].innerHTML=pred[i].className+': '+pred[i].probability.toFixed(2);
  }
}
</script>
</body>
</html>
